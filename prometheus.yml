global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "gateway:8000"

  - job_name: "ingestion_service"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "ingestion:8001"

  - job_name: "query_service"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "query:8002"

  - job_name: "memory_service"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "memory:8003"