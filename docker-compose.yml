version: "3.8"

services:
  # =========================================================
  # POSTGRESQL (Persistent Database)
  # =========================================================
  postgres:
    image: postgres:16-alpine
    container_name: research_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research_pass
      POSTGRES_DB: research_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =========================================================
  # API GATEWAY (port 8000)
  # =========================================================
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: research_gateway
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - INGESTION_SERVICE_URL=http://ingestion:8001
      - QUERY_SERVICE_URL=http://query:8002
      - MEMORY_SERVICE_URL=http://memory:8003
      - RATE_LIMIT_REQUESTS=60
      - RATE_LIMIT_WINDOW=60
    depends_on:
      - redis
      - ingestion
      - query
      - memory
    restart: unless-stopped

  # =========================================================
  # INGESTION SERVICE (port 8001)
  # =========================================================
  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: research_ingestion
    ports:
      - "8001:8001"
    environment:
      # OLD (Ollama): - OLLAMA_URL=http://ollama:11434
      # OLD (Ollama): - MODEL_NAME=mistral
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - EMBED_MODEL=BAAI/bge-small-en-v1.5
      - VECTOR_DB_PATH=data/vector_store
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://research:research_pass@postgres:5432/research_db
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=uploads
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      # OLD (Ollama): ollama:
      # OLD (Ollama):   condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  # =========================================================
  # QUERY SERVICE (port 8002)
  # =========================================================
  query:
    build:
      context: .
      dockerfile: services/query/Dockerfile
    container_name: research_query
    ports:
      - "8002:8002"
    environment:
      # OLD (Ollama): - OLLAMA_URL=http://ollama:11434
      # OLD (Ollama): - MODEL_NAME=mistral
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - EMBED_MODEL=BAAI/bge-small-en-v1.5
      - VECTOR_DB_PATH=data/vector_store
      - REDIS_URL=redis://redis:6379/0
      - MEMORY_SERVICE_URL=http://memory:8003
      - DATABASE_URL=postgresql://research:research_pass@postgres:5432/research_db
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      # OLD (Ollama): ollama:
      # OLD (Ollama):   condition: service_started
      memory:
        condition: service_started
    restart: unless-stopped

  # =========================================================
  # MEMORY SERVICE (port 8003)
  # =========================================================
  memory:
    build:
      context: .
      dockerfile: services/memory/Dockerfile
    container_name: research_memory
    ports:
      - "8003:8003"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://research:research_pass@postgres:5432/research_db
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # =========================================================
  # MINIO (S3-compatible Object Storage - free, self-hosted)
  # =========================================================
  minio:
    image: minio/minio:latest
    container_name: research_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # =========================================================
  # REDIS CACHE
  # =========================================================
  redis:
    image: redis:7-alpine
    container_name: research_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # =========================================================
  # (OLD) LLM BOOTSTRAP - Ollama model pull. DISABLED - Gemini API is used
  # =========================================================
  # llm-setup:
  #   image: ollama/ollama:latest
  #   container_name: research_llm_setup
  #   environment:
  #     - OLLAMA_HOST=http://ollama:11434
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   depends_on:
  #     - ollama
  #   entrypoint: ["/bin/sh", "-c"]
  #   command:
  #     - >
  #       echo "pushing mistral (first run can take several minutes)...";
  #       ollama pull mistral;
  #       echo "LLM model ready"
  #   restart: "no"

  # =========================================================
  # (OLD) OLLAMA (LLM). DISABLED - Gemini API is used instead
  # =========================================================
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: research_ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   restart: unless-stopped

  # =========================================================
  # PROMETHEUS (Monitoring)
  # =========================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: research_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    restart: unless-stopped

  # =========================================================
  # GRAFANA (Dashboards)
  # =========================================================
  grafana:
    image: grafana/grafana:latest
    container_name: research_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  # OLD (Ollama): ollama_data:
  prometheus_data:
  grafana_data:
  minio_data: